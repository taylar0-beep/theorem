<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>定理マスタ</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; max-width: 920px; margin: 24px auto; padding: 0 16px; }
    .toolbar { position: sticky; top: 0; background: #fff; padding: 12px 0 16px; border-bottom: 1px solid #ddd; z-index: 10; }
    #q { width: 100%; max-width: 420px; font-size: 16px; padding: 8px 10px; }
    article { border: 1px solid #ddd; border-radius: 8px; padding: 16px 20px; margin: 20px 0; }
    .no { color: #666; font-size: 0.9em; }
    h2 { margin: 4px 0 12px; font-size: 1.15em; }
    .formula {
      background: #f7f4ea;
      padding: 24px 12px;
      font-size: 1.35em;
      overflow-x: auto;
      text-align: center;
    }
    .hidden { display: none; }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="toolbar">
    <h1>定理一覧</h1>
    <input id="q" type="search" placeholder="番号・定理名・解説・参照元で検索">
  </div>
  <div id="list">読み込み中...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwaF85aH0VcOZwfJL9xvr0GuzZx8xtjx45ye65_SUP9e6sKvtTPFZghtBXRDCj8ZmLo/exec";

    const listEl = document.getElementById("list");
    const qEl = document.getElementById("q");

    function toMath(src) {
      const s = String(src || "").trim();
      if (!s) return "";
      if (s.includes("$$") || s.includes("$") || s.includes("\\(") || s.includes("\\[")) return s;
      return `$$${s}$$`;
    }

    function typeset() {
      if (window.MathJax && MathJax.typesetPromise) {
        return MathJax.typesetPromise([listEl]);
      }
    }

    fetch(API_URL, { redirect: "follow" })
      .then(res => res.text())
      .then(text => {
        const items = JSON.parse(text).filter(item => item.番号 || item.定理名);

        listEl.innerHTML = items.map(item => {
          const id = item.番号 || "";
          const ref = item["参照元（最新優先）"] || "";
          const href = item.アドレス || "";
          const refHtml = href
            ? `<a href="${href}" target="_blank" rel="noopener">${ref || href}</a>`
            : ref;
          const formula = item.中心式LaTeX || item.中心式 || "";
          const hay = [item.番号, item.定理名, item.何の定理か, ref].join(" ").toLowerCase();

          return `
            <article data-q="${hay.replace(/"/g, "&quot;")}">
              <div class="no">${id}</div>
              <h2>${item.定理名 || ""}</h2>
              <div class="formula">${toMath(formula)}</div>
              <p>${item.何の定理か || ""}</p>
              <p>参照元: ${refHtml}</p>
            </article>
          `;
        }).join("");

        return typeset();
      })
      .catch(err => {
        listEl.textContent = "読み込み失敗: " + err;
      });

    qEl.addEventListener("input", () => {
      const q = qEl.value.trim().toLowerCase();
      document.querySelectorAll("#list article").forEach(el => {
        el.classList.toggle("hidden", !(!q || (el.dataset.q || "").includes(q)));
      });
    });
  </script>
</body>
</html>
