<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マスタ一覧</title>
</head>
<body>
  <div id="list">読み込み中...</div>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwaF85aH0VcOZwfJL9xvr0GuzZx8xtjx45ye65_SUP9e6sKvtTPFZghtBXRDCj8ZmLo/exec";

    fetch(API_URL, { redirect: "follow" })
      .then(res => res.text())
      .then(text => {
        const items = JSON.parse(text);
        console.log(items);

        const list = document.getElementById("list");
        if (!Array.isArray(items)) {
          list.textContent = "JSONの形が配列ではありません";
          return;
        }

        list.innerHTML = items.map(item => {
          const label = item.label || item.name || item.URL || "リンク";
          const href = item.url || item.URL || "#";
          return `<p><a href="${href}">${label}</a></p>`;
        }).join("");
      })
      .catch(err => {
        document.getElementById("list").textContent = "読み込み失敗: " + err;
      });
  </script>
</body>
</html>
