
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シン苫米地定理一覧</title>

  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      max-width: 920px;
      margin: 12px auto;
      padding: 0 12px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 4px 0 10px;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    .toolbar h1 {
      margin: 0 0 6px;
      font-size: 1.5em;
    }

    #q {
      width: 100%;
      max-width: 420px;
      font-size: 16px;
      padding: 8px 10px;
      box-sizing: border-box;
    }

    /*
     * PC・iPad：
     * カード幅が340px以上確保できる場合は2列。
     * 狭い場合は自動的に1列。
     */
    #list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
    }

    article {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin: 0;
      min-width: 0;
      box-sizing: border-box;
    }

    .no {
      color: #666;
      font-size: 0.9em;
    }

    h2 {
      margin: 4px 0 12px;
      font-size: 1.1em;
      overflow-wrap: anywhere;
    }

    .formula {
      background: #f7f4ea;
      padding: 16px 0;
      text-align: center;
      overflow: visible;
    }

    .formula-line {
      margin: 0.35em 0;
      overflow: visible;
    }

    .formula mjx-container {
      max-width: none;
      overflow: visible;
    }

    .formula mjx-container[display="true"] {
      margin: 0.2em 0;
    }

    .hidden {
      display: none;
    }

    .error {
      border: 1px solid #e0b4b4;
      background: #fff5f5;
      color: #a33;
      padding: 14px;
      margin-top: 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /*
     * スマホは必ず1列
     */
    @media (max-width: 640px) {
      body {
        margin: 8px 0;
        padding: 0;
      }

      .toolbar {
        padding: 4px 12px 10px;
      }

      .toolbar h1 {
        margin: 0 0 6px;
        font-size: 1.35em;
      }

      #list {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      article {
        padding: 16px 0;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      article .no,
      article h2,
      article p {
        padding: 0 12px;
      }

      .formula {
        padding: 16px 4px;
      }

      h2 {
        font-size: 1.02em;
      }
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ["$", "$"],
          ["\\(", "\\)"]
        ],
        displayMath: [
          ["$$", "$$"],
          ["\\[", "\\]"]
        ]
      },

      chtml: {
        scale: 1,
        minScale: 0.5,
        displayAlign: "center"
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>
</head>

<body>

  <div class="toolbar">
    <h1>シン苫米地定理一覧</h1>

    <input
      id="q"
      type="search"
      placeholder="番号・定理名・数式・解説・参照元で検索"
    >
  </div>

  <div id="list">読み込み中...</div>


  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwaF85aH0VcOZwfJL9xvr0GuzZx8xtjx45ye65_SUP9e6sKvtTPFZghtBXRDCj8ZmLo/exec";

    const listEl = document.getElementById("list");
    const qEl = document.getElementById("q");


    /*
     * ==========================================================
     * HTMLエスケープ
     * ==========================================================
     */
    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }


    /*
     * ==========================================================
     * Unicode数式要素
     * ==========================================================
     */
    const UNICODE_ATOM =
      "[\\p{L}\\p{N}\\p{M}_⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉]+";


    /*
     * ==========================================================
     * 特殊な微分式
     * ==========================================================
     *
     * d[Fₚₕᵧₛ + Φ_A]/dt
     * dS_{gen}/dt
     */
    function convertSpecialFractions(s) {

      /*
       * d[Fₚₕᵧₛ + Φ_A]/dt
       */
      s = s.replace(
        /d\[Fₚₕᵧₛ\s*\+\s*Φ_A\]\/dt/gu,
        "\\frac{d[Fₚₕᵧₛ + Φ_A]}{dt}"
      );


      /*
       * dS_{gen}/dt
       */
      s = s.replace(
        /dS_\{gen\}\/dt/gu,
        "\\frac{dS_{gen}}{dt}"
      );


      return s;
    }


    /*
     * ==========================================================
     * min / max の表示用波括弧
     * ==========================================================
     *
     * MathJaxでは
     *
     * min{...}
     *
     * の { } は表示用の括弧ではないため消える。
     *
     * そこで、
     *
     * min{...}
     * max{...}
     * minᵤ{...}
     * maxᵤ{...}
     *
     * を表示用の \left\{...\right\} に変換する。
     *
     * 先にこの処理を行い、
     * その後で中身の B/r などを分数化する。
     */


    /*
     * minᵤ{...}
     */
    function convertMinUBraces(s) {

      s = s.replace(
        /minᵤ\{([^{}]*)\}/gu,
        "\\min_{u}\\left\\{$1\\right\\}"
      );

      return s;
    }


    /*
     * maxᵤ{...}
     */
    function convertMaxUBraces(s) {

      s = s.replace(
        /maxᵤ\{([^{}]*)\}/gu,
        "\\max_{u}\\left\\{$1\\right\\}"
      );

      return s;
    }


    /*
     * min{...}
     */
    function convertMinBraces(s) {

      s = s.replace(
        /min\{([^{}]*)\}/gu,
        "\\min\\left\\{$1\\right\\}"
      );

      return s;
    }


    /*
     * max{...}
     */
    function convertMaxBraces(s) {

      s = s.replace(
        /max\{([^{}]*)\}/gu,
        "\\max\\left\\{$1\\right\\}"
      );

      return s;
    }


    /*
     * ==========================================================
     * 偏微分の自動分数化
     * ==========================================================
     *
     * ∂W_G/∂t
     * ∂Ṽσ/∂σ
     * ∂ℱ/∂ℓ
     */
    function convertDerivativeFractions(s) {

      const pattern =
        new RegExp(
          "([+-]?)∂(" +
          UNICODE_ATOM +
          ")\\/∂(" +
          UNICODE_ATOM +
          ")",
          "gu"
        );


      s = s.replace(
        pattern,
        (match, sign, numerator, denominator) => {

          return (
            sign +
            "\\frac{\\partial " +
            numerator +
            "}{\\partial " +
            denominator +
            "}"
          );
        }
      );


      return s;
    }


    /*
     * ==========================================================
     * 通常の微分の自動分数化
     * ==========================================================
     *
     * dW/dt
     * dW_G/dt
     */
    function convertNormalDerivativeFractions(s) {

      const pattern =
        new RegExp(
          "([+-]?)d(" +
          UNICODE_ATOM +
          ")\\/d(" +
          UNICODE_ATOM +
          ")",
          "gu"
        );


      s = s.replace(
        pattern,
        (match, sign, numerator, denominator) => {

          return (
            sign +
            "\\frac{d" +
            numerator +
            "}{d" +
            denominator +
            "}"
          );
        }
      );


      return s;
    }


    /*
     * ==========================================================
     * Δによる差分の自動分数化
     * ==========================================================
     */
    function convertDeltaFractions(s) {

      const pattern =
        new RegExp(
          "([+-]?)Δ(" +
          UNICODE_ATOM +
          ")\\/Δ(" +
          UNICODE_ATOM +
          ")",
          "gu"
        );


      s = s.replace(
        pattern,
        (match, sign, numerator, denominator) => {

          return (
            sign +
            "\\frac{\\Delta " +
            numerator +
            "}{\\Delta " +
            denominator +
            "}"
          );
        }
      );


      return s;
    }


    /*
     * ==========================================================
     * 括弧付き分数
     * ==========================================================
     *
     * (a+b)/(c+d)
     */
    function convertParenthesizedFractions(s) {

      const pattern =
        /(\([^()]+\))\/(\([^()]+\))/gu;

      return s.replace(
        pattern,
        "\\frac{$1}{$2}"
      );
    }


    /*
     * ==========================================================
     * 単純な分数
     * ==========================================================
     *
     * 1/(κm)
     * B/r
     * a/b
     *
     * 注意：
     * すでに \frac になっている部分には
     * なるべく干渉しない。
     * ==========================================================
     */
    function convertSimpleFractions(s) {

      /*
       * まず括弧付き分母。
       *
       * 例：
       * 1/(κm)
       */
      s = s.replace(
        /([A-Za-z0-9₀₁₂₃₄₅₆₇₈₉α-ωΑ-ΩℱℓΦσμλπρτ]+)\/\(([^()]+)\)/gu,
        "\\frac{$1}{$2}"
      );


      /*
       * 単純な A/B
       */
      const pattern =
        new RegExp(
          "(?<![\\\\A-Za-z0-9_}])" +
          "(" +
          UNICODE_ATOM +
          ")" +
          "\\/" +
          "(" +
          UNICODE_ATOM +
          ")" +
          "(?![A-Za-z0-9_])",
          "gu"
        );


      return s.replace(
        pattern,
        (match, numerator, denominator) => {

          return (
            "\\frac{" +
            numerator +
            "}{" +
            denominator +
            "}"
          );
        }
      );
    }


    /*
     * ==========================================================
     * Unicode上付き・下付き
     * ==========================================================
     */
    function convertUnicodeScripts(s) {

      const subscriptMap = {
        "₀": "0",
        "₁": "1",
        "₂": "2",
        "₃": "3",
        "₄": "4",
        "₅": "5",
        "₆": "6",
        "₇": "7",
        "₈": "8",
        "₉": "9"
      };


      const superscriptMap = {
        "⁰": "0",
        "¹": "1",
        "²": "2",
        "³": "3",
        "⁴": "4",
        "⁵": "5",
        "⁶": "6",
        "⁷": "7",
        "⁸": "8",
        "⁹": "9"
      };


      /*
       * Unicode下付き
       *
       * 例：
       * V₀ → V_0
       * p꜀ᵣᵢₜ はそのまま保持
       */
      s = s.replace(
        /([A-Za-zΑ-Ωα-ωℱℓΦσμλπρτ])([₀₁₂₃₄₅₆₇₈₉]+)/gu,
        (match, base, sub) => {

          const digits =
            [...sub]
              .map(ch =>
                subscriptMap[ch] || ch
              )
              .join("");

          return `${base}_${digits}`;
        }
      );


      /*
       * Unicode上付き
       */
      s = s.replace(
        /([A-Za-zΑ-Ωα-ωℱℓΦσμλπρτ])([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/gu,
        (match, base, sup) => {

          const digits =
            [...sup]
              .map(ch =>
                superscriptMap[ch] || ch
              )
              .join("");

          return `${base}^${digits}`;
        }
      );


      return s;
    }


    /*
     * ==========================================================
     * 数式全体を正規化
     * ==========================================================
     */
    function normalizeFormula(src) {

      let s = String(src || "");


      /*
       * 全角マイナス
       */
      s = s.replaceAll("−", "-");


      /*
       * --------------------------------------------------------
       * 特殊な分数
       * --------------------------------------------------------
       */
      s = convertSpecialFractions(s);


      /*
       * --------------------------------------------------------
       * min / max の表示用波括弧
       *
       * ★ここを分数変換より先に行う。
       * --------------------------------------------------------
       */
      s = convertMinUBraces(s);
      s = convertMaxUBraces(s);
      s = convertMinBraces(s);
      s = convertMaxBraces(s);


      /*
       * --------------------------------------------------------
       * 一般的な分数
       * --------------------------------------------------------
       */
      s = convertDerivativeFractions(s);

      s = convertNormalDerivativeFractions(s);

      s = convertDeltaFractions(s);

      s = convertParenthesizedFractions(s);

      s = convertSimpleFractions(s);


      /*
       * --------------------------------------------------------
       * Unicode数学記号
       * --------------------------------------------------------
       */
      s = s.replaceAll("∂", "\\partial ");
      s = s.replaceAll("Δ", "\\Delta ");


      /*
       * Unicode添字
       */
      s = convertUnicodeScripts(s);


      return s;
    }


    /*
     * ==========================================================
     * MathJax用HTMLへ変換
     * ==========================================================
     */
    function toMath(src) {

      return normalizeFormula(src)
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean)
        .map(line => {

          /*
           * すでにLaTeXデリミタがある場合はそのまま。
           */
          const raw =
            /\$|\\\(|\\\[|\\begin/.test(line)
              ? line
              : `$$${line}$$`;


          return `
            <div class="formula-line">
              ${raw}
            </div>
          `;
        })
        .join("");
    }


    /*
     * ==========================================================
     * 数式の横幅フィット
     * ==========================================================
     */
    function fitMath() {

      document
        .querySelectorAll(".formula mjx-container")
        .forEach(el => {

          el.style.transform = "none";
          el.style.height = "";


          const parentW =
            el.parentElement.clientWidth;


          const w =
            el.scrollWidth;


          if (!parentW || w <= parentW) {
            return;
          }


          const scale =
            parentW / w;


          el.style.transformOrigin =
            "center top";


          el.style.transform =
            `scale(${scale})`;


          el.style.height =
            el.getBoundingClientRect().height + "px";
        });
    }


    /*
     * ==========================================================
     * MathJax組版
     * ==========================================================
     */
    function typeset() {

      if (
        window.MathJax &&
        MathJax.typesetPromise
      ) {

        return MathJax
          .typesetPromise([listEl])
          .then(fitMath);
      }


      fitMath();
    }


    /*
     * ==========================================================
     * Google Apps Scriptからデータ取得
     * ==========================================================
     *
     * 一時的なエラーなら最大3回再試行。
     */
    async function fetchData(maxRetries = 3) {

      let lastError = null;


      for (
        let attempt = 1;
        attempt <= maxRetries;
        attempt++
      ) {

        try {

          /*
           * キャッシュ回避
           */
          const url =
            API_URL +
            (API_URL.includes("?") ? "&" : "?") +
            "t=" +
            Date.now();


          const res =
            await fetch(url, {
              redirect: "follow",
              cache: "no-store"
            });


          const text =
            await res.text();


          /*
           * HTTPエラー
           */
          if (!res.ok) {

            throw new Error(
              `Google Apps Script が HTTP ${res.status} を返しました。`
            );
          }


          /*
           * HTMLエラーページの検出
           */
          const trimmed =
            text.trim();


          if (
            trimmed.startsWith("<!DOCTYPE") ||
            trimmed.startsWith("<html") ||
            trimmed.startsWith("<HTML")
          ) {

            throw new Error(
              "Google Apps Script からJSONではなくHTMLが返されました。"
            );
          }


          /*
           * JSON解析
           */
          const data =
            JSON.parse(text);


          if (!Array.isArray(data)) {

            throw new Error(
              "Google Apps Script の返却データが配列ではありません。"
            );
          }


          return data;


        } catch (err) {

          lastError = err;


          if (attempt === maxRetries) {
            break;
          }


          /*
           * 1秒 → 2秒と待って再試行
           */
          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                attempt * 1000
              )
          );
        }
      }


      throw (
        lastError ||
        new Error(
          "データ取得に失敗しました。"
        )
      );
    }


    /*
     * ==========================================================
     * 一覧読み込み
     * ==========================================================
     */
    async function loadItems() {

      try {

        listEl.textContent =
          "読み込み中...";


        const data =
          await fetchData(3);


        /*
         * 番号または定理名がある行だけ表示
         */
        const items =
          data.filter(
            item =>
              item.番号 ||
              item.定理名
          );


        listEl.innerHTML =
          items
            .map(item => {

              const id =
                item.番号 || "";


              const ref =
                item["参照元（最新優先）"] || "";


              const href =
                item.アドレス || "";


              const refHtml = href

                ? `<a
                    href="${href}"
                    target="_blank"
                    rel="noopener"
                  >${escapeHtml(
                    ref || href
                  )}</a>`

                : escapeHtml(ref);


              /*
               * 中心式LaTeXを優先
               */
              const formula =
                item.中心式LaTeX ||
                item.中心式 ||
                "";


              /*
               * 検索対象
               *
               * 数式も含める。
               */
              const hay = [
                item.番号,
                item.定理名,
                item.何の定理か,
                ref,
                formula
              ]
                .join(" ")
                .toLowerCase();


              return `
                <article
                  data-q="${hay.replace(
                    /"/g,
                    "&quot;"
                  )}"
                >

                  <div class="no">
                    ${escapeHtml(id)}
                  </div>


                  <h2>
                    ${escapeHtml(
                      item.定理名 || ""
                    )}
                  </h2>


                  <div class="formula">
                    ${toMath(formula)}
                  </div>


                  <p>
                    ${escapeHtml(
                      item.何の定理か || ""
                    ).replaceAll(
                      "\n",
                      "<br>"
                    )}
                  </p>


                  <p>
                    参照元: ${refHtml}
                  </p>

                </article>
              `;
            })
            .join("");


        /*
         * MathJaxで組版
         */
        await typeset();


      } catch (err) {

        console.error(err);


        listEl.innerHTML = `
          <div class="error">
            読み込みに失敗しました。

            ${escapeHtml(
              err && err.message
                ? err.message
                : String(err)
            )}

            Google Apps Script 側で一時的なエラーが
            発生している可能性があります。
          </div>
        `;
      }
    }


    /*
     * ==========================================================
     * 初回読み込み
     * ==========================================================
     */
    loadItems();


    /*
     * ==========================================================
     * 検索
     * ==========================================================
     */
    qEl.addEventListener(
      "input",
      () => {

        const q =
          qEl.value
            .trim()
            .toLowerCase();


        document
          .querySelectorAll(
            "#list article"
          )
          .forEach(el => {

            el.classList.toggle(
              "hidden",
              !(
                !q ||
                (
                  el.dataset.q || ""
                ).includes(q)
              )
            );

          });
      }
    );


    /*
     * ==========================================================
     * ブラウザ幅変更時に数式を再計算
     * ==========================================================
     */
    window.addEventListener(
      "resize",
      fitMath
    );

  </script>

</body>
</html>
