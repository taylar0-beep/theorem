<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>定理マスタ</title>
  <style>
    body { font-family: sans-serif; line-height: 1.6; max-width: 920px; margin: 24px auto; padding: 0 12px; }
    .toolbar { position: sticky; top: 0; background: #fff; padding: 12px 0 16px; border-bottom: 1px solid #ddd; z-index: 10; }
    #q { width: 100%; max-width: 420px; font-size: 16px; padding: 8px 10px; box-sizing: border-box; }
    article { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .no { color: #666; font-size: 0.9em; }
    h2 { margin: 4px 0 12px; font-size: 1.1em; overflow-wrap: anywhere; }
    .formula {
      background: #f7f4ea;
      padding: 16px 8px;
      text-align: center;
      overflow-x: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .formula-line { margin: 0.35em 0; }
    .formula mjx-container {
      max-width: 100%;
      overflow-x: hidden;
    }
    .formula mjx-container[display="true"] { margin: 0.2em 0; }
    .hidden { display: none; }
    @media (max-width: 640px) {
      h2 { font-size: 1.02em; }
      .formula { font-size: 0.95em; padding: 12px 4px; }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      chtml: {
        scale: 1,
        minScale: 0.55,
        displayAlign: "center"
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="toolbar">
    <h1>定理一覧</h1>
    <input id="q" type="search" placeholder="番号・定理名・解説・参照元で検索">
  </div>
  <div id="list">読み込み中...</div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwaF85aH0VcOZwfJL9xvr0GuzZx8xtjx45ye65_SUP9e6sKvtTPFZghtBXRDCj8ZmLo/exec";

    const listEl = document.getElementById("list");
    const qEl = document.getElementById("q");

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function toMath(src) {
      const lines = String(src || "")
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean);

      return lines.map(line => {
        const raw = /\$|\\\(|\\\[|\\begin/.test(line)
          ? line
          : `$$${line}$$`;
        return `<div class="formula-line">${raw}</div>`;
      }).join("");
    }

    function typeset() {
      if (window.MathJax && MathJax.typesetPromise) {
        return MathJax.typesetPromise([listEl]);
      }
    }

    fetch(API_URL, { redirect: "follow" })
      .then(res => res.text())
      .then(text => {
        const items = JSON.parse(text).filter(item => item.番号 || item.定理名);

        listEl.innerHTML = items.map(item => {
          const id = item.番号 || "";
          const ref = item["参照元（最新優先）"] || "";
          const href = item.アドレス || "";
          const refHtml = href
            ? `<a href="${href}" target="_blank" rel="noopener">${escapeHtml(ref || href)}</a>`
            : escapeHtml(ref);
          const formula = item.中心式LaTeX || item.中心式 || "";
          const hay = [item.番号, item.定理名, item.何の定理か, ref].join(" ").toLowerCase();

          return `
            <article data-q="${hay.replace(/"/g, "&quot;")}">
              <div class="no">${escapeHtml(id)}</div>
              <h2>${escapeHtml(item.定理名 || "")}</h2>
              <div class="formula">${toMath(formula)}</div>
              <p>${escapeHtml(item.何の定理か || "").replaceAll("\n", "<br>")}</p>
              <p>参照元: ${refHtml}</p>
            </article>
          `;
        }).join("");

        return typeset();
      })
      .catch(err => {
        listEl.textContent = "読み込み失敗: " + err;
      });

    qEl.addEventListener("input", () => {
      const q = qEl.value.trim().toLowerCase();
      document.querySelectorAll("#list article").forEach(el => {
        el.classList.toggle("hidden", !(!q || (el.dataset.q || "").includes(q)));
      });
    });
  </script>
</body>
</html>
