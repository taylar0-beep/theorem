
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シン苫米地定理一覧</title>

  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      max-width: 920px;
      margin: 12px auto;
      padding: 0 12px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      background: #fff;
      padding: 4px 0 10px;
      border-bottom: 1px solid #ddd;
      z-index: 10;
    }

    .toolbar h1 {
      margin: 0 0 6px;
      font-size: 1.5em;
    }

    #q {
      width: 100%;
      max-width: 420px;
      font-size: 16px;
      padding: 8px 10px;
      box-sizing: border-box;
    }

    /* PC・iPad：横幅が十分なら2列 */
    #list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 16px;
    }

    article {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      margin: 0;
      min-width: 0;
    }

    .no {
      color: #666;
      font-size: 0.9em;
    }

    h2 {
      margin: 4px 0 12px;
      font-size: 1.1em;
      overflow-wrap: anywhere;
    }

    .formula {
      background: #f7f4ea;
      padding: 16px 0;
      text-align: center;
      overflow: visible;
    }

    .formula-line {
      margin: 0.35em 0;
      overflow: visible;
    }

    .formula mjx-container {
      max-width: none;
      overflow: visible;
    }

    .formula mjx-container[display="true"] {
      margin: 0.2em 0;
    }

    .hidden {
      display: none;
    }

    .error {
      border: 1px solid #e0b4b4;
      background: #fff5f5;
      color: #a33;
      padding: 14px;
      margin-top: 16px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* スマホは必ず1列 */
    @media (max-width: 640px) {
      body {
        margin: 8px 0;
        padding: 0;
      }

      .toolbar {
        padding: 4px 12px 10px;
      }

      .toolbar h1 {
        margin: 0 0 6px;
        font-size: 1.35em;
      }

      #list {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      article {
        padding: 16px 0;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      article .no,
      article h2,
      article p {
        padding: 0 12px;
      }

      .formula {
        padding: 16px 4px;
      }

      h2 {
        font-size: 1.02em;
      }
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
      },
      chtml: {
        scale: 1,
        minScale: 0.5,
        displayAlign: "center"
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>
</head>

<body>

  <div class="toolbar">
    <h1>シン苫米地定理一覧</h1>

    <input
      id="q"
      type="search"
      placeholder="番号・定理名・数式・解説・参照元で検索"
    >
  </div>

  <div id="list">読み込み中...</div>


  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwaF85aH0VcOZwfJL9xvr0GuzZx8xtjx45ye65_SUP9e6sKvtTPFZghtBXRDCj8ZmLo/exec";

    const listEl = document.getElementById("list");
    const qEl = document.getElementById("q");


    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }


    function toMath(src) {
      return String(src || "")
        .split(/\r?\n/)
        .map(x => x.trim())
        .filter(Boolean)
        .map(line => {

          const raw =
            /\$|\\\(|\\\[|\\begin/.test(line)
              ? line
              : `$$${line}$$`;

          return `<div class="formula-line">${raw}</div>`;
        })
        .join("");
    }


    function fitMath() {
      document
        .querySelectorAll(".formula mjx-container")
        .forEach(el => {

          el.style.transform = "none";
          el.style.height = "";

          const parentW = el.parentElement.clientWidth;
          const w = el.scrollWidth;

          if (!parentW || w <= parentW) return;

          const scale = parentW / w;

          el.style.transformOrigin = "center top";
          el.style.transform = `scale(${scale})`;
          el.style.height =
            el.getBoundingClientRect().height + "px";
        });
    }


    function typeset() {
      if (
        window.MathJax &&
        MathJax.typesetPromise
      ) {
        return MathJax
          .typesetPromise([listEl])
          .then(fitMath);
      }

      fitMath();
    }


    async function fetchData(maxRetries = 3) {

      let lastError = null;

      for (let attempt = 1; attempt <= maxRetries; attempt++) {

        try {

          const url =
            API_URL +
            (API_URL.includes("?") ? "&" : "?") +
            "t=" +
            Date.now();


          const res = await fetch(url, {
            redirect: "follow",
            cache: "no-store"
          });


          const text = await res.text();


          if (!res.ok) {
            throw new Error(
              `Google Apps Script が HTTP ${res.status} を返しました。`
            );
          }


          const trimmed = text.trim();


          if (
            trimmed.startsWith("<!DOCTYPE") ||
            trimmed.startsWith("<html") ||
            trimmed.startsWith("<HTML")
          ) {
            throw new Error(
              "Google Apps Script からJSONではなくHTMLが返されました。"
            );
          }


          const data = JSON.parse(text);


          if (!Array.isArray(data)) {
            throw new Error(
              "Google Apps Script の返却データが配列ではありません。"
            );
          }


          return data;


        } catch (err) {

          lastError = err;

          if (attempt === maxRetries) {
            break;
          }


          await new Promise(resolve =>
            setTimeout(resolve, attempt * 1000)
          );
        }
      }


      throw lastError ||
        new Error("データ取得に失敗しました。");
    }


    async function loadItems() {

      try {

        listEl.textContent = "読み込み中...";


        const data = await fetchData(3);


        const items = data.filter(
          item =>
            item.番号 ||
            item.定理名
        );


        listEl.innerHTML = items
          .map(item => {

            const id =
              item.番号 || "";

            const ref =
              item["参照元（最新優先）"] || "";

            const href =
              item.アドレス || "";


            const refHtml = href

              ? `<a
                  href="${href}"
                  target="_blank"
                  rel="noopener"
                >${escapeHtml(ref || href)}</a>`

              : escapeHtml(ref);


            const formula =
              item.中心式LaTeX ||
              item.中心式 ||
              "";


            const hay = [
              item.番号,
              item.定理名,
              item.何の定理か,
              ref,
              formula
            ]
              .join(" ")
              .toLowerCase();


            return `
              <article
                data-q="${hay.replace(/"/g, "&quot;")}"
              >

                <div class="no">
                  ${escapeHtml(id)}
                </div>

                <h2>
                  ${escapeHtml(item.定理名 || "")}
                </h2>

                <div class="formula">
                  ${toMath(formula)}
                </div>

                <p>
                  ${escapeHtml(
                    item.何の定理か || ""
                  ).replaceAll("\n", "<br>")}
                </p>

                <p>
                  参照元: ${refHtml}
                </p>

              </article>
            `;
          })
          .join("");


        await typeset();


      } catch (err) {

        console.error(err);

        listEl.innerHTML = `
          <div class="error">
            読み込みに失敗しました。

            ${escapeHtml(
              err && err.message
                ? err.message
                : String(err)
            )}

            Google Apps Script 側で一時的なエラーが発生している可能性があります。
            少し時間を置いて再読み込みしてください。
          </div>
        `;
      }
    }


    loadItems();


    qEl.addEventListener("input", () => {

      const q =
        qEl.value
          .trim()
          .toLowerCase();


      document
        .querySelectorAll("#list article")
        .forEach(el => {

          el.classList.toggle(
            "hidden",
            !(
              !q ||
              (el.dataset.q || "")
                .includes(q)
            )
          );

        });
    });


    window.addEventListener(
      "resize",
fitMath ); </script> </body> </html>
